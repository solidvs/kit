# Laboratory: Keycloak federated to an LDAP directory (ADR-0009), and the database engines of the
# platform (ADR-0016), each behind a profile: `postgresql` (reference) or `sqlserver`.
# Passwords, client secrets and the TLS certificate are generated by `lab/lab.ts` or by the
# laboratory tests for each run; nothing here is real.
name: identity-lab

services:
  directory:
    image: osixia/openldap:1.5.0
    command: --copy-service
    environment:
      LDAP_ORGANISATION: Example
      LDAP_DOMAIN: example.test
      LDAP_ADMIN_PASSWORD: ${LAB_LDAP_ADMIN_PASSWORD:?generated by the laboratory}
      LDAP_TLS: 'false'
    volumes:
      - ${LAB_WORKDIR:?generated by the laboratory}/ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${LAB_KEYCLOAK_ADMIN_PASSWORD:?generated by the laboratory}
      KC_HEALTH_ENABLED: 'true'
      # Heap: Keycloak's default (70% of the machine) unless a test sets a smaller one.
      JAVA_OPTS_KC_HEAP: ${LAB_KEYCLOAK_HEAP:--XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=50}
    volumes:
      - ${LAB_WORKDIR}/realm:/opt/keycloak/data/import:ro
      # Platform login theme and Keycloak extensions (ADR-0018), copied into the work folder by
      # lab/keycloak.ts from their builds, so the folder Docker mounts is always the work folder.
      - ${LAB_WORKDIR}/keycloak/themes/platform:/opt/keycloak/themes/platform:ro
      - ${LAB_WORKDIR}/keycloak/providers:/opt/keycloak/providers:ro
    ports:
      - 127.0.0.1:${LAB_KEYCLOAK_PORT:-8081}:8080
    depends_on: [directory]

  # Reference engine. TLS with the laboratory's certificate: clients verify it like any other.
  postgresql:
    profiles: [postgresql]
    image: postgres:18.6-alpine3.24@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_PASSWORD: ${LAB_DATABASE_ADMIN_PASSWORD:-}
    # PostgreSQL only reads a private key owned by its own user; the mounted copy is not.
    entrypoint:
      - sh
      - -c
      - >-
        install -o postgres -g postgres -m 0600 /lab-tls/server.key /var/lib/postgresql/server.key &&
        install -o postgres -g postgres -m 0644 /lab-tls/server.crt /var/lib/postgresql/server.crt &&
        exec docker-entrypoint.sh postgres -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/server.crt -c ssl_key_file=/var/lib/postgresql/server.key
        -c ssl_min_protocol_version=TLSv1.2
    volumes:
      - ${LAB_WORKDIR}/tls:/lab-tls:ro
    ports:
      - 127.0.0.1:55432:5432
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 2s
      retries: 60

  # Supported engine. The image is amd64 only: on Apple silicon it needs Docker's Rosetta
  # emulation (Colima: `vmType: vz` and `rosetta: true`; Docker Desktop: "Use Rosetta") and at
  # least 4 GB for the virtual machine. Developer edition: free for development and tests only;
  # whoever starts it accepts its licence with LAB_MSSQL_ACCEPT_EULA=Y; without it, it does not start.
  # Both engines refuse to start without the administrator password the laboratory generates.
  sqlserver:
    profiles: [sqlserver]
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f
    platform: linux/amd64
    environment:
      ACCEPT_EULA: ${LAB_MSSQL_ACCEPT_EULA:-N}
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${LAB_DATABASE_ADMIN_PASSWORD:-}
    volumes:
      - ${LAB_WORKDIR}/tls:/var/opt/mssql/tls:ro
      - ${LAB_WORKDIR}/tls/mssql.conf:/var/opt/mssql/mssql.conf:ro
    ports:
      - 127.0.0.1:51433:1433
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -b -Q "SELECT 1" > /dev/null']
      interval: 5s
      retries: 60
