# Platform login theme. Every page of the login flow renders inside template.ftl; login.ftl is the
# sign-in form. Styles come from @solidvs/ui (copied at build) plus login.css.
parent=base
import=common/keycloak
locales=pt-BR
styles=css/fonts.css css/tokens.css css/base.css css/button.css css/textfield.css css/login.css
scripts=js/password-toggle.js js/account-chooser.js

# Class names used by the inherited pages (errors, info, update password, logout confirmation).
kcHtmlClass=ui-login-html
kcBodyClass=ui-login-body
kcFormGroupClass=ui-login__field
kcLabelClass=ui-login__label
kcInputClass=ui-login__input
kcInputErrorMessageClass=ui-login__error
kcButtonClass=ui-button
kcButtonPrimaryClass=ui-button--primary
kcButtonDefaultClass=ui-button--default
kcButtonBlockClass=ui-button--fit
kcButtonLargeClass=
kcFormButtonsClass=ui-login__actions
kcFormSettingClass=ui-login__options
kcAlertClass=ui-login__alert
kcFormCardClass=ui-login__card
kcFormHeaderClass=ui-login__card-header
kcInputGroup=ui-login__input-group
